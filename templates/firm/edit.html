{% extends "base.html" %}

{% block content %}
<div class="row">
  <div class="col-md-7 mx-auto">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="section-title mb-3">Firma Düzenle</h2>

        <form method="post">
          <div class="mb-3">
            <label for="name" class="form-label">Firma Adı</label>
            <input
              type="text"
              class="form-control"
              id="name"
              name="name"
              value="{{ form_data.get('name', firm.name) }}"
              required
            />
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label for="city" class="form-label">Şehir</label>
              <input
                type="text"
                class="form-control"
                id="city"
                name="city"
                value="{{ form_data.get('city', firm.city) }}"
                required
              />
            </div>

            <div class="col-md-8 mb-3">
              <label for="sector" class="form-label">Sektör</label>
              <input
                type="text"
                class="form-control"
                id="sector"
                name="sector"
                value="{{ form_data.get('sector', firm.sector) }}"
                required
              />
            </div>
          </div>

          <div class="mb-3">
            <label for="description" class="form-label">Firma Açıklaması (Opsiyonel)</label>
            <textarea
              class="form-control"
              id="description"
              name="description"
              rows="3"
            >{{ form_data.get('description', firm.description or '') }}</textarea>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">İletişim Telefonu (Opsiyonel)</label>
            <input
              type="text"
              class="form-control"
              id="phone"
              name="phone"
              value="{{ form_data.get('phone', firm.phone or '') }}"
            />
          </div>

          <div class="d-flex gap-2 justify-content-end">
            <a href="{{ url_for('firm_detail') }}" class="btn btn-outline-secondary">
              Vazgeç
            </a>
            <button type="submit" class="btn btn-primary">
              Kaydet
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
