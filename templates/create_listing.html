{% extends "base.html" %}

{% block content %}
<div class="row">
  <div class="col-lg-8 mx-auto">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="section-title mb-3">Yeni İlan Oluştur</h2>
        <p class="text-muted small mb-4">
          Mevcut bir firma adına yeni bir atık ilanı oluşturabilirsiniz.
        </p>

        <form method="post" class="listing-form">
          <div class="mb-3">
            <label for="company_id" class="form-label">Firma</label>
            <select
              class="form-select"
              id="company_id"
              name="company_id"
              required
            >
              <option value="">Firma seçin...</option>
              {% for company in companies %}
                <option value="{{ company.id }}"
                  {% if form_data.get('company_id')|int == company.id %}selected{% endif %}
                >
                  {{ company.name }} ({{ company.city }})
                </option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label for="title" class="form-label">İlan Başlığı</label>
            <input
              type="text"
              class="form-control"
              id="title"
              name="title"
              required
              value="{{ form_data.get('title', '') }}"
            >
          </div>

          <div class="mb-3">
            <label for="description" class="form-label">Açıklama</label>
            <textarea
              class="form-control"
              id="description"
              name="description"
              rows="4"
              required
            >{{ form_data.get('description', '') }}</textarea>
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label for="category" class="form-label">Kategori</label>
              <select
                class="form-select"
                id="category"
                name="category"
                required
              >
                <option value="">Kategori seçin...</option>
                {% for cat in CATEGORIES %}
                  <option value="{{ cat }}"
                    {% if form_data.get('category') == cat %}selected{% endif %}
                  >
                    {{ cat }}
                  </option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-4 mb-3">
              <label for="quantity" class="form-label">Miktar</label>
              <input
                type="text"
                class="form-control"
                id="quantity"
                name="quantity"
                placeholder="Örn: 3 ton"
                required
                value="{{ form_data.get('quantity', '') }}"
              >
            </div>

            <div class="col-md-4 mb-3">
              <label for="city" class="form-label">Şehir</label>
              <input
                type="text"
                class="form-control"
                id="city"
                name="city"
                required
                value="{{ form_data.get('city', '') }}"
              >
            </div>
          </div>

          <div class="mb-3">
            <p class="text-muted small mb-0">
              Durum: <strong>Aktif</strong> (varsayılan olarak atanır)
            </p>
          </div>

          <div class="d-flex justify-content-between">
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
              İptal
            </a>
            <button type="submit" class="btn btn-primary">
              Kaydet
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
