<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
      Atık Değişim Platformu
    </a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNavbar"
      aria-controls="mainNavbar"
      aria-expanded="false"
      aria-label="Menüyü Aç/Kapat"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a
            class="nav-link {% if request.endpoint == 'index' %}active{% endif %}"
            href="{{ url_for('index') }}"
          >
            Ana Sayfa
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link {% if request.endpoint == 'listings' %}active{% endif %}"
            href="{{ url_for('listings') }}"
          >
            İlanlar
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link {% if request.endpoint == 'create_listing' %}active{% endif %}"
            href="{{ url_for('create_listing') }}"
          >
            İlan Aç
          </a>
        </li>
        <li class="nav-item">
          {% if current_user.is_authenticated %}
            <a
              class="nav-link {% if request.endpoint in ['firm_detail', 'firm_edit', 'firm_create'] %}active{% endif %}"
              href="{{ url_for('firm_detail') }}"
            >
              Firma Bilgilerim
            </a>
          {% endif %}
        </li>
      </ul>

      <div class="d-flex align-items-center gap-2 ms-lg-3 mt-2 mt-lg-0">
        {% if current_user.is_authenticated %}
          <form method="post" action="{{ url_for('logout') }}">
            <button class="btn btn-outline-secondary btn-sm" type="submit">
              Çıkış Yap
            </button>
          </form>
        {% else %}
          <a
            class="btn btn-outline-secondary btn-sm"
            href="{{ url_for('login') }}"
          >
            Giriş Yap
          </a>
          <a
            class="btn btn-primary btn-sm"
            href="{{ url_for('register') }}"
          >
            Kayıt Ol
          </a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
