{% with messages = get_flashed_messages(with_categories=True) %}
  {% if messages %}
    <div class="mb-3">
      {% for category, message in messages %}
        {% set mapped = category %}
        {% if category == 'message' %}
          {% set mapped = 'info' %}
        {% endif %}
        <div class="alert alert-{{ mapped }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Kapat"></button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
